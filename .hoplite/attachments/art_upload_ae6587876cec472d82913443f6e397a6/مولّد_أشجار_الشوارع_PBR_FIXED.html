<style>

#app{display:flex;height:100%}
#view{flex:1;position:relative;min-width:0;background:var(--bg)}

#stat{position:absolute;bottom:12px;inset-inline-start:18px;font-size:12px;color:#9ba2ab;pointer-events:none}
#ui{width:340px;background:var(--pn);border-inline-end:0;border-inline-start:1px solid var(--ln);overflow-y:auto;padding:14px 16px 24px}

 for(let i=0;i<seg;i++)for(let j=0;j<rad;j++){const a=n+i*(rad+1)+j,b=a+rad+1;B.i.push(a,a+1,b,b,a+1,b+1)}
